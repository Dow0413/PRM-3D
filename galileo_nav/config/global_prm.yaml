# PRM-3D global planner configuration (single source of truth).
#
# This is the file the nav stack reads when you select the PRM global planner
# (nav_main.launch.py global:=prm  /  pcd_nav_sim.launch.py route_source:=prm).
#
# The planner loads one PNG per floor, builds a fused multi-floor PRM roadmap
# from connections.json (topological union polygons for the stairwells), and on
# each /goal_pose plans from odometry to the goal across floors. Metric (x,y,z)
# is converted to (pixel, floor_id): x/y via resolution+origin, floor_id via the
# per-floor z_min/z_max below.
#
# Path Z comes from per-floor 2.5D elevation grids (floors[].elevation_npy
# below, z_source: npy): each path point is a bilinear lookup in its floor's
# grid. The grids are generated offline from the same PCD the 2D maps were
# sliced from by process_multi_floor_elevations.py (per-cell ground Z over the
# walkable pixels, stairwell bands widened toward the next floor, holes
# interpolated, lightly smoothed) — no runtime PCD access, and each grid can
# be inspected as an image before planning. Points a grid cannot answer fall
# back to the direct PCD query (see "3D map for path Z" below), then to the
# previous point's Z / the floor's ground_z.
prm_planner_node:
  ros__parameters:

    # ---- I/O & behaviour ----
    frame_id: "map"
    output_path_topic: "/global_path"        # canonical global path contract
    odom_topic: "/Odometry"                  # start source (start_from_odom mode)
    goal_topic: "/goal_pose"                 # PoseStamped goal
    clicked_point_topic: "/clicked_point"    # PointStamped (two-click mode)
    start_from_odom: true                    # true: start = odom; false: two-click start/goal
    path_height_offset: 0.1                  # z offset added to the published path (m); 机器人车体高度抬升

