    map_resolution: 0.05
    map_origin_x: -40.615631
    map_origin_y: -40.222412
    flip_y: true

    # ---- 3D map for path Z (fallback + z_source: pcd) ----
    pcd_map_path: "/home/dow/maps/gazebo_sim/galileo_0907.pcd"
    pcd_search_radius: 0.2
    pcd_ground_tol_below: 0.6       # anchor window below ground (m)
    pcd_ground_tol_above: 0.9       # anchor window above ground (m)
    pcd_z_cluster_tol: 0.15         # densest-Z-cluster width (m); 0 disables
    pcd_z_quantile: 0.25            # quantile inside the cluster (0=min .. 1=max)


    # ---- PRM-3D parameters ----
    expansion_radius: 6.0                     # static obstacle inflation (px)
    dynamic_inflation_px: 6.0                 # 动态障碍入图膨胀 (px)：markObstacle 直接写
                                              # 本体+该值 的黑色圆盘，与静态黑区（膨胀
                                              # expansion_radius）同待遇；重规划不重建膨胀+
                                              # PRM采样，入图时一次膨胀到位。窄通道绕不过去
                                              # (未找到路径)可单独调小。
    prm_k_nodes: 10000                          # roadmap node count per floor
    prm_r_nei: 25.0                           # neighbor radius (px)
    fuse_k_neighbors: 10                      # online start/goal insertion K
    fuse_cross_radius: 8.0                    # cross-floor edge distance threshold (px)

    # ---- 贴墙惩罚（静态墙 + 动态障碍共用）----
    # 同层边权重 = 欧氏距离 × (1 + gain × (1 - c/clearance_px))，c 为边上到最近
    # (膨胀后)障碍的最小距离(px)。离墙越近权重越大，规划会自然远离墙走安全通道，
    # 而非贴着墙求最短。gain=0 关闭。clearance_px 是像素（分辨率 0.05 时 10px=0.5m），
    # 超过该距离的边不再惩罚。
    # 静态墙：建图时(fuseGraph)烤进边权；动态障碍：planFused 搜索时实时计算同一
    # 公式（c = 边到障碍圆盘边缘的间隙）。效果＝绕行路径离已知障碍约 0.5m 软间距，
    # 窄通道仍可通行（只是变贵），压到圆盘本体的边才被切——禁行区不膨胀。
    wall_penalty_gain: 2.0
    wall_penalty_clearance_px: 10.0

    # ---- path Z post-processing ----
    # Elevation lookups can carry isolated outliers (stray PCD points, wrong
    # z-band pixels). Two guards keep the published path navigable:
    #   z_median_filter_window: sliding-window median on the per-point Z.
    #     7 = the point plus 3 before/after; 0 disables.
    #   z_max_slope: max |dz| per metre of horizontal travel. Remaining steps
    #     (e.g. floor-band gaps at stairwells) become ramps instead of walls.
    #     1.5 ≈ 56 deg, comfortably above normal stair pitch; 0 disables.
    z_median_filter_window: 7
    z_max_slope: 1.5

    # ---- dynamic-obstacle replanning（safeplanner-2 服务架构）----
    # 全局端是纯服务端：local_replan 在 20Hz 碰撞检测线程里过滤点云（Z 带 +
    # 感知半径 + 栅格降采样 + cKDTree 最近查），触发后把「当前位姿起点 + 原
    # 终点 + map 帧障碍点云」打包成一次 ReplanPlan 服务请求原子送达。本节点：
    #   1) updateDynamicObstacles —— 点级入图：以每个点为圆心 mark 一个 forbid
    #      半径（dynamic_inflation_px + obstacle_radius_m）的黑色圆盘（不拟合
    #      圆盘：只扫到障碍物边角时圆心会放错，多点圆盘并成真实形状），障碍点
    #      带记忆（obstacle_decay_sec），过期自动抹除；
    #   2) planFused —— 受影响边重算：同层边到最近障碍点距离 < forbid 切边，
    #      间隙 < forbid+safety 按贴墙公式加权；全间距无路时间距降级重试
    #      （全 → 半 → 物理最小），仍无路返回 success=false（局部端停车保持）；
    #   3) 成功发布 /global_path 并经服务响应返回新路径。
    # 感知参数（Z 带/感知半径/稀疏化/禁行距离）全在 local_replan.yaml ——
    # 障碍唯一来源是服务请求，不存在双源不同步。
    enable_dynamic_replan: true
    replan_service: "/replan_plan"            # 重规划服务名（与 local_replan.yaml 一致）
    replan_check_rate: 1.0                    # 障碍过期检查频率 (Hz)
    obstacle_cluster_tol: 0.1                # 点匹配距离 (m)：新点与老点近于此值 → 刷新记忆，否则新增
    obstacle_radius_m: 0.0                    # 动态障碍额外膨胀 (m)：并入 forbid（本体+
                                              # dynamic_inflation_px + 该值）
    obstacle_decay_sec: 30.0                  # 障碍记忆时长：未再观测到多久后从地图抹除 (s)。
                                              # 必须覆盖绕行耗时，否则转弯后障碍出视野就被
                                              # "遗忘"，重规划又穿回原障碍处（2s 太短）
    obstacle_elev_tol: 0.2                    # 入图高程校验 (m)：点 Z 与该层高度图 npy 在此
                                              # 像素的地面高程差超过该值 → 天花板/别的楼层
                                              # 结构（下楼梯扫到的楼下天花板差 ~2m），不入图。
                                              # 仅 z_source=npy 的楼层生效；设负数关闭
    replan_debug_window: true                 # safeplanner-2 风格调试窗口（随 launch 启动）：
                                              # 当前楼层地图+全局路径(蓝)+障碍点云(黑)+
                                              # 障碍圆盘(红)+机器人(绿)。
                                              # 左键点击当前显示楼层的地图区域可直接指定
                                              # 终点：窗口像素 -> map xy -> 指定楼层像素，
                                              # 不需要输入 z，也不通过 z 区间反推楼层。
                                              # 无 $DISPLAY 自动关闭；false 可关闭窗口

# Pure-pursuit follower: /global_path + odom -> nav_vel Twist.
# Used by prm_real_nav.launch.py (planning + velocity only, no simulation).
# Progress matching and the goal check are 3D (Z weighted): overlapping floors
# can never hijack tracking, and the goal only counts at the goal's height.
path_follower:
  ros__parameters:
    path_topic: "/global_path"
    odom_topic: "/Odometry"
    cmd_topic: "/cmd_vel"
    lookahead_distance: 0.5
    max_linear_velocity: 0.8
    max_angular_velocity: 0.8
    goal_tolerance: 0.3
    floor_z_tolerance: 0.8          # goal height check; must stay below floor gap
    slow_radius: 1.0
    rotate_cutoff_rad: 0.7
    backtrack_window: 2.0           # how far progress may regress along the arc (m)
    window_ahead: 8.0               # forward search window along the arc (m)
    control_rate: 20.0
